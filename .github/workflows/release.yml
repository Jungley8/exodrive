name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - run: go test -race -count=1 ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, gui: true }
          - { goos: darwin, goarch: amd64, gui: true }
          - { goos: linux, goarch: amd64, gui: false }
          - { goos: linux, goarch: arm64, gui: false }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/exodrive_${GOOS}_${GOARCH}/exodrive" ./cmd/exodrive

      - name: Build GUI
        if: matrix.gui
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/exodrive_${GOOS}_${GOARCH}/exodrive-gui" ./cmd/exodrive-gui

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp README.md README.zh.md LICENSE "dist/exodrive_${GOOS}_${GOARCH}/"
          tar -C dist -czf "dist/exodrive_${TAG}_${GOOS}_${GOARCH}.tar.gz" "exodrive_${GOOS}_${GOARCH}"

      - uses: actions/upload-artifact@v4
        with:
          name: exodrive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  bundle:
    name: bundle (darwin/${{ matrix.goarch }})
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Bundle the window
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: scripts/make-app.sh "${{ steps.version.outputs.number }}" dist

      - name: Zip the bundle
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GOARCH: ${{ matrix.goarch }}
        run: ditto -c -k --keepParent "dist/Exodrive.app" "dist/Exodrive_${TAG}_darwin_${GOARCH}.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: exodrive-app-darwin-${{ matrix.goarch }}
          path: dist/*.app.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
